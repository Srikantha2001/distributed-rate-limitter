services:
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    profiles:
      - redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    profiles:
      - redis
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data

volumes:
  redis-data:
  redis-insight: